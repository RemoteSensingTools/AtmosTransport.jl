# Lab preset: production-scale synthetic cubed-sphere cases measured by the
# lab lane (benchmarking/lab/run_lab_benchmarks.jl) on the lab machines. The
# machine table in benchmarking/lab/machines.toml supplies the backend and the
# float types; this file fixes everything else so lab results stay comparable
# over time.
#
# Every value is part of the dashboard history. Adding or removing grids,
# levels, tracer counts, or operators adds or ends series. Changing steps,
# repeats, scheme, or convection_depth changes what an existing series
# measures: do that together with a new `group` name.

description = "Production-scale C90/C180 L72/L137 cases for the lab GPUs"
group = "Lab Synthetic CS Sweep"

# C90 and C180 are the production cubed-sphere resolutions; L72 is the
# GEOS/MERRA-2 column and L137 the ERA5 column.
grid = ["C90", "C180"]
levels = [72, 137]

# One tracer isolates per-field cost; twelve matches the multi-tracer
# production runs (and spans two six-tracer convection batches). `adjoint`
# runs at one tracer only (case_matrix in benchmarking/src/case_options.jl):
# 44 cases per float type.
tracers = [1, 12]

operator = ["advection", "diffusion", "convection", "full", "io", "adjoint"]
scheme = ["ppm"]

steps = 5
warmup_steps = 2
repeats = 5

# Bottom levels in the TM5 convection matrix (0 = full column), clipped to
# each case's level count. 85 matches the production ERA5 L137 run
# (config/runs/catrine_era5_n320_c180_linrood7_dec2021_2weeks.toml: deepest
# measured convective reach 84 levels); L72 cases keep the full column.
convection_depth = 85
