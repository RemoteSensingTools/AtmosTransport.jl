# Plan 26 P0.C4 — placeholder C48 inversion config.
#
# This is the SCHEMA reference for a production C48 inversion. The
# driver's `[meteo.source] = "synthetic_constant"` is the only met
# backend wired up in v1; a real-met backend (preprocessed C48
# binaries) is gated on the ERA5/GEOS-IT downloads still in flight
# at 2026-05-13 and ships in a follow-up. Do not run this config
# verbatim against the current driver — it documents the intended
# parameter shape and serves as the template for the eventual
# C48 14-day stretch run. The current driver rejects the sketched
# `meteo.binary_path` and `observations.path` keys as unknown.

[mesh]
Nc = 48
Hp = 3
float_type = "Float64"

[time]
nsteps = 336                  # 14 days at 1-hour timesteps
dt_seconds = 3600.0

[meteo]
source = "geos_it_c48"        # NOT YET IMPLEMENTED in v1
binary_path = "/data/preprocessed/c48_2024_jan.bin"

# Monotone PPM, the scheme of the production cubed-sphere forward runs; its
# adjoint replays the recorded limiter branches.
[advection]
scheme = "ppm"

[observations]
path = "data/observations/c48_co2_2024_jan.nc"   # v1 NetCDF schema

[control]
name = "daily_emissions"
steps = [1]                   # populated programmatically per window
normalize = true
initial = "background"

[covariance]
kind = "isotropic_gaussian"
sigma_value = 0.3             # tracer-native units
correlation_length_cells = 4.0

[preconditioner]
enabled = true
optim_type = "log_normal"
background_value = 1.0e-9     # placeholder — set from prior emissions

[optimizer]
kind = "lbfgs"
iterations = 30
gradient_tolerance = 1.0e-8
m = 15
log = true
show_trace = false
