# Generated by scripts/generate_trendy_s3_2021_all_tracers_config.py.
# Full-year C90 transport of separate GPP and TER tracers for 6
# usable TRENDYv14 S3 models (12 tracers total). Each tracer carries a
# 400 ppm numerical background; subtract 400 ppm from output VMR/XCO2.

[architecture]
use_gpu = true
backend = "cuda"

[numerics]
float_type = "Float32"

[input]
