  kind = "uniform"
  background = 4.0e-4
  [tracers.co2_trendy_jules_es_gpp.surface_flux]
  kind = "cs_native"
  file = "/kiwi-data/Data/groupMembers/cfranken/AtmosTransport/fluxes/TRENDYv14/S3/C90/2021/TRENDYv14_S3_JULES-ES_gpp_diurnal_ter_daily_hourly_co2flux_c90_2021.nc"
  variable = "GPP_CO2_FLUX"
  molar_mass_kg_mol = 0.0440095
