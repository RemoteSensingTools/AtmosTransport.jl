# Generated by generate_trendy_s3_2021_all_tracers_config.py, which was never committed; launched by scripts/heritage/run_trendy_s3_2021_batches.sh.
# Full-year C90 transport of separate GPP and TER tracers for 5
# usable TRENDYv14 S3 models (10 tracers total). Each tracer carries a
# 400 ppm numerical background; subtract 400 ppm from output VMR/XCO2.

[architecture]
use_gpu = true
backend = "cuda"

[numerics]
float_type = "Float32"

[input]
folder = "~/data/AtmosTransport/met/era5/n320_to_c90/transport_binary_v4_l137_f32_no_convection"
start_date = "2021-01-01"
end_date = "2021-12-31"
file_pattern = "era5_n320_transport_{YYYYMMDD}_float32.bin"

[advection]
scheme = "ppm"

[tracers.co2_trendy_sdgvm_gpp]
  [tracers.co2_trendy_sdgvm_gpp.init]
  kind = "uniform"
  background = 4.0e-4
  [tracers.co2_trendy_sdgvm_gpp.surface_flux]
  kind = "cs_native"
  file = "/kiwi-data/Data/groupMembers/cfranken/AtmosTransport/fluxes/TRENDYv14/S3/C90/2021/TRENDYv14_S3_SDGVM_gpp_diurnal_ter_daily_hourly_co2flux_c90_2021.nc"
  variable = "GPP_CO2_FLUX"
  molar_mass_kg_mol = 0.0440095
  time_varying = true
  temporal_scheme = "stepwise"

