# TRENDYv14 S3 Ra and Rh transported separately (3 models x 2 tracers).
# Both components are pure emissions (rise ~200 ppm each over the window), so
# small 10 ppm carriers suffice. RA + RH must reproduce the TER tracer of
# config/runs/trendy_v14_s3_c90_2018_2024.toml by linearity (closure check).
# Requires flux files regenerated with RA_CO2_FLUX/RH_CO2_FLUX (v2 of
# prepare_trendy_s3_multiyear_c90.py) in $ATMOSTRANSPORT_DATA_ROOT/fluxes/trendy_v2.

[architecture]
use_gpu = true
backend = "cuda"

[numerics]
float_type = "Float32"

[input]
folder = "$ATMOSTRANSPORT_DATA_ROOT/met/c90_l66"
start_date = "2018-05-01"
end_date = "2024-12-31"
file_pattern = "era5_n320_transport_{YYYYMMDD}_float32.bin"

[advection]
scheme = "ppm"

[tracers.co2_clm_ra]
  [tracers.co2_clm_ra.init]
  kind = "uniform"
  background = 1.0e-5

  [tracers.co2_clm_ra.surface_flux]
  kind = "cs_native"
  file = "$ATMOSTRANSPORT_DATA_ROOT/fluxes/trendy_v2/TRENDYv14_S3_CLM_gpp_ter_nee_daily_co2flux_c90_2018_2024.nc"
  variable = "RA_CO2_FLUX"
  molar_mass_kg_mol = 0.0440095
  time_varying = true
  temporal_scheme = "stepwise"

[tracers.co2_clm_rh]
  [tracers.co2_clm_rh.init]
  kind = "uniform"
  background = 1.0e-5

  [tracers.co2_clm_rh.surface_flux]
  kind = "cs_native"
  file = "$ATMOSTRANSPORT_DATA_ROOT/fluxes/trendy_v2/TRENDYv14_S3_CLM_gpp_ter_nee_daily_co2flux_c90_2018_2024.nc"
  variable = "RH_CO2_FLUX"
  molar_mass_kg_mol = 0.0440095
  time_varying = true
  temporal_scheme = "stepwise"

[tracers.co2_jules_es_ra]
  [tracers.co2_jules_es_ra.init]
  kind = "uniform"
  background = 1.0e-5

  [tracers.co2_jules_es_ra.surface_flux]
  kind = "cs_native"
  file = "$ATMOSTRANSPORT_DATA_ROOT/fluxes/trendy_v2/TRENDYv14_S3_JULES-ES_gpp_ter_nee_daily_co2flux_c90_2018_2024.nc"
  variable = "RA_CO2_FLUX"
  molar_mass_kg_mol = 0.0440095
  time_varying = true
  temporal_scheme = "stepwise"

[tracers.co2_jules_es_rh]
  [tracers.co2_jules_es_rh.init]
  kind = "uniform"
  background = 1.0e-5

  [tracers.co2_jules_es_rh.surface_flux]
  kind = "cs_native"
  file = "$ATMOSTRANSPORT_DATA_ROOT/fluxes/trendy_v2/TRENDYv14_S3_JULES-ES_gpp_ter_nee_daily_co2flux_c90_2018_2024.nc"
  variable = "RH_CO2_FLUX"
  molar_mass_kg_mol = 0.0440095
  time_varying = true
  temporal_scheme = "stepwise"

[tracers.co2_orchidee_ra]
  [tracers.co2_orchidee_ra.init]
  kind = "uniform"
  background = 1.0e-5

  [tracers.co2_orchidee_ra.surface_flux]
  kind = "cs_native"
  file = "$ATMOSTRANSPORT_DATA_ROOT/fluxes/trendy_v2/TRENDYv14_S3_ORCHIDEE_gpp_ter_nee_daily_co2flux_c90_2018_2024.nc"
  variable = "RA_CO2_FLUX"
  molar_mass_kg_mol = 0.0440095
  time_varying = true
  temporal_scheme = "stepwise"

[tracers.co2_orchidee_rh]
  [tracers.co2_orchidee_rh.init]
  kind = "uniform"
  background = 1.0e-5

  [tracers.co2_orchidee_rh.surface_flux]
  kind = "cs_native"
  file = "$ATMOSTRANSPORT_DATA_ROOT/fluxes/trendy_v2/TRENDYv14_S3_ORCHIDEE_gpp_ter_nee_daily_co2flux_c90_2018_2024.nc"
  variable = "RH_CO2_FLUX"
  molar_mass_kg_mol = 0.0440095
  time_varying = true
  temporal_scheme = "stepwise"

[diffusion]
kind = "tm5_dkg"
surface_flux_boundary = true

[convection]
kind = "none"

[output]
format = "netcdf"
split = "daily"
snapshot_interval_hours = 24
path = "$ATMOSTRANSPORT_DATA_ROOT/output/trendy_rarh_c90/trendy_rarh_c90_{YYYYMMDD}.nc"
deflate_level = 1
shuffle = true

[output.fields]
tracers = ["co2_clm_ra", "co2_clm_rh", "co2_jules_es_ra", "co2_jules_es_rh", "co2_orchidee_ra", "co2_orchidee_rh"]
layers = "none"
column_mean = true
column_mass_per_area = false
air_mass_layers = "none"
air_mass = false
air_mass_per_area = false
column_air_mass_per_area = false
