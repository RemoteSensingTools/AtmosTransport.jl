# One-day end-to-end validation for fluxcom_sif_gpp_ter_c90_2021_advdiff.toml.

[architecture]
use_gpu = true
backend = "cuda"

[numerics]
float_type = "Float32"

[input]
folder = "~/data/AtmosTransport/met/era5/n320_to_c90/transport_binary_v4_l137_f32_no_convection"
start_date = "2021-01-01"
end_date = "2021-01-01"
file_pattern = "era5_n320_transport_{YYYYMMDD}_float32.bin"

[advection]
scheme = "ppm"

[tracers.co2_sif_gpp]
  [tracers.co2_sif_gpp.init]
  kind = "uniform"
  background = 4.0e-4
  [tracers.co2_sif_gpp.surface_flux]
  kind = "cs_native"
  file = "/kiwi-data/Data/satellite/FLUXCOM-X/X-BASE/2021/pilot/sif_gpp_hourly_co2flux_c90_2021.nc"
  variable = "CO2_FLUX"
  molar_mass_kg_mol = 0.0440095
  time_varying = true
  temporal_scheme = "stepwise"

[tracers.co2_fluxcom_gpp]
  [tracers.co2_fluxcom_gpp.init]
  kind = "uniform"
  background = 4.0e-4
  [tracers.co2_fluxcom_gpp.surface_flux]
  kind = "cs_native"
  file = "/kiwi-data/Data/satellite/FLUXCOM-X/X-BASE/2021/derived/fluxcom_x_gpp_diurnal_ter_daily_hourly_co2flux_c90_2021.nc"
  variable = "GPP_CO2_FLUX"
  molar_mass_kg_mol = 0.0440095
  time_varying = true
  temporal_scheme = "stepwise"

[tracers.co2_fluxcom_ter]
  [tracers.co2_fluxcom_ter.init]
  kind = "uniform"
  background = 4.0e-4
  [tracers.co2_fluxcom_ter.surface_flux]
  kind = "cs_native"
  file = "/kiwi-data/Data/satellite/FLUXCOM-X/X-BASE/2021/derived/fluxcom_x_gpp_diurnal_ter_daily_hourly_co2flux_c90_2021.nc"
  variable = "TER_CO2_FLUX"
  molar_mass_kg_mol = 0.0440095
  time_varying = true
  temporal_scheme = "stepwise"

[diffusion]
kind = "tm5_dkg"
surface_flux_boundary = true

[convection]
kind = "none"

[output]
format = "netcdf"
split = "daily"
snapshot_interval_hours = 3
snapshot_file = "~/data/AtmosTransport/output/fluxcom_sif_gpp_ter_c90_2021_advdiff_smoke/fluxcom_sif_gpp_ter_c90_{YYYYMMDD}.nc"
deflate_level = 1
shuffle = true

[output.fields]
tracers = ["co2_sif_gpp", "co2_fluxcom_gpp", "co2_fluxcom_ter"]
layers = "selected"
levels = [96, 105, 118]
column_mean = true
column_mass_per_area = false
air_mass_layers = "none"
air_mass = false
air_mass_per_area = false
column_air_mass_per_area = false
