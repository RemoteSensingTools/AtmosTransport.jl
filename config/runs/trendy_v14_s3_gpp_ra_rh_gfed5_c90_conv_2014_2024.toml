split = "daily"
snapshot_interval_hours = 24
path = "$ATMOSTRANSPORT_DATA_ROOT/output/trendy_gfed5_c90_conv/trendy_gfed5_c90_conv_{YYYYMMDD}.nc"
deflate_level = 1
shuffle = true

[output.fields]
tracers = [
  "co2_clm_gpp",
  "co2_clm_ra",
  "co2_clm_rh",
  "co2_clm_nee",
  "co2_jules_es_gpp",
  "co2_jules_es_ra",
