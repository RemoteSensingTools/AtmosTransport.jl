# ERA5 regridded to GEOS-native C180/L85, Dec 2-4 2021, standard split PPM
# + PBL diffusion.
# Requires binaries generated by:
#   scripts/preprocessing/heritage/build_era5_geos_c180_cfl85_tm5_surface.sh

[input]
folder       = "/temp1/c180_era5_geosgrid_cfl85_tm5_surface_f32_steps16_fixed_20260505"
start_date   = "2021-12-02"
end_date     = "2021-12-04"
file_pattern = "era5_transport_{YYYYMMDD}_merged1000Pa_float32.bin"

[architecture]
use_gpu = true

[numerics]
float_type = "Float32"

[run]
scheme = "ppm"

[tracers.co2_natural]
[tracers.co2_natural.init]
kind = "catrine_co2"

[tracers.co2_fossil]
[tracers.co2_fossil.init]
kind = "uniform"
background = 0.0

[tracers.co2_fossil.surface_flux]
kind       = "gridfed_fossil_co2"
file       = "/home/cfranken/data/AtmosTransport/catrine/Emissions/gridfed/GCP-GridFEDv2024.0_2021.short.nc"
time_index = 12

[diffusion]
kind = "tm5_beljaars_viterbo_local_kz"
surface_flux_boundary = true

[output]
snapshot_hours = [0, 6, 12, 18, 24, 30, 36, 42, 48, 54, 60, 66, 72]
snapshot_file  = "/temp1/c180_era5_geosgrid_cfl85_3d_fixed_20260505/advdiff_ppm.nc"
