# src_v2 LatLon 96x48 48h Catrine — F32 GPU (CUDA).
# Most representative of production GPU runs: F32 state + F64 binary
# on disk, L40S delivers ~91 TFLOPS at this precision.

[input]
binary_paths = [
    "~/data/AtmosTransport/met/era5/ll96x48/transport_binary_v2_tropo34_dec2021_f64/era5_transport_20211201_merged1000Pa_float64.bin",
    "~/data/AtmosTransport/met/era5/ll96x48/transport_binary_v2_tropo34_dec2021_f64/era5_transport_20211202_merged1000Pa_float64.bin",
]

[numerics]
float_type = "Float32"

[architecture]
use_gpu = true

[run]
tracer_name = "CO2"
air_mass_reset_mode = "none"
stop_window = 48

[advection]
scheme = "upwind"

[init]
kind = "catrine_co2"

[output]
snapshot_hours = [0, 6, 12, 24, 36, 48]
snapshot_file = "~/data/AtmosTransport/output/src_v2_snapshots/era5_ll96x48_catrine_natco2_48h_f32_gpu.nc"
