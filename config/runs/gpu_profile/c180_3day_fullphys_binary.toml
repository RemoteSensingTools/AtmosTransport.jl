# GEOS-IT native C180, Dec 2-4 2021, split PPM + PBL diffusion + CMFMC.
# GPU profiling copy: points at the v4-merge025hpa-adaptive Float32 binaries
# under ~/data/AtmosTransport/met/geosit_c180/. Snapshot output redirected
# to /temp1/c180_geosit_native_3d/gpu_profile/ to keep production runs clean.

[input]
folder       = "/temp2/c180_geosit_native_v4_dec2021_f32"
start_date   = "2021-12-02"
end_date     = "2021-12-04"
file_pattern = "geos_transport_{YYYYMMDD}_float32.bin"

[architecture]
use_gpu = true

[numerics]
float_type = "Float32"

[run]
air_mass_reset_mode = "preserve_tracer_mass"

[advection]
scheme = "ppm"

[tracers.co2_natural]
[tracers.co2_natural.init]
kind = "catrine_co2"

[tracers.co2_fossil]
[tracers.co2_fossil.init]
kind = "uniform"
background = 0.0

[tracers.co2_fossil.surface_flux]
kind       = "gridfed_fossil_co2"
file       = "/home/cfranken/data/AtmosTransport/catrine/Emissions/gridfed/GCP-GridFEDv2024.0_2021.short.nc"
time_index = 12

[diffusion]
kind = "tm5_beljaars_viterbo_local_kz"

[convection]
kind = "cmfmc"

[output]
snapshot_hours = [0, 6, 12, 18, 24, 30, 36, 42, 48, 54, 60, 66, 72]
snapshot_file  = "/temp1/c180_geosit_native_3d/gpu_profile/fullphysics_ppm.atmsnap"
format         = "binary_mmap"
