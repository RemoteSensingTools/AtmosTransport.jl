# TRENDYv14 S3, all 23 usable models; 46 tracers in one C30/L66 run.
# NPP_CO2_FLUX = Ra-GPP (atmospheric uptake), RH_CO2_FLUX = Rh.
# Subtract the 1300/10 ppm initial carriers to obtain component responses.
# Matches the previous OCO-2 comparison window; TRENDYv14 ends in 2024.
[architecture]
use_gpu = true
backend = "cuda"

[numerics]
float_type = "Float32"

[input]
folder = "$ATMOSTRANSPORT_DATA_ROOT/met/c30_l66"
start_date = "2014-09-01"
end_date = "2024-12-31"
file_pattern = "era5_c30_transport_{YYYYMMDD}_float32.bin"

[input.staging]
enabled = true
dir = "$TRENDY_RUN_ROOT/met_stage"
lookahead_days = 3
keep_behind_days = 0

[run]
air_mass_reset_mode = "preserve_tracer_mass"

[advection]
scheme = "ppm"

[diffusion]
kind = "tm5_dkg"
surface_flux_boundary = true

[convection]
kind = "none"

[tracers.co2_cable_pop_npp.init]
kind = "uniform"
background = 0.0013

[tracers.co2_cable_pop_npp.surface_flux]
kind = "cs_native"
file = "$TRENDY_RUN_ROOT/fluxes/TRENDYv14_S3_CABLE-POP_npp_rh_daily_co2flux_c30_2014_2024.nc"
variable = "NPP_CO2_FLUX"
molar_mass_kg_mol = 0.0440095
time_varying = true
temporal_scheme = "stepwise"

[tracers.co2_cable_pop_rh.init]
kind = "uniform"
background = 1e-05

[tracers.co2_cable_pop_rh.surface_flux]
kind = "cs_native"
file = "$TRENDY_RUN_ROOT/fluxes/TRENDYv14_S3_CABLE-POP_npp_rh_daily_co2flux_c30_2014_2024.nc"
variable = "RH_CO2_FLUX"
molar_mass_kg_mol = 0.0440095
time_varying = true
temporal_scheme = "stepwise"

