# TRENDYv14 S3 GPP/Ra/Rh/NEE over the full OCO-2 era, GEOS C90,
# 2014-09-01 .. 2024-12-31 (OCO-2 record starts 2014-09-06; TRENDY ends 2024).
# 12 tracers, one run, no convection (this archive carries none; see the memo
# section 4f homogeneity audit). Carriers sized for the 10.3-year window:
# GPP draws down up to ~770 ppm -> 1300 ppm carrier; Ra/Rh only rise -> 10 ppm;
# NEE drifts -30..-60 ppm -> 200 ppm. Direct NEE avoids the large-carrier F32
# differencing penalty (memo 4g/4k).
# Fluxes: scripts/preprocessing/prepare_trendy_s3_multiyear_c90.py v2 (adds
# RA/RH; TER == RA + RH bitwise in the files).

[architecture]
use_gpu = true
backend = "cuda"

[numerics]
float_type = "Float32"

[input]
folder = "$ATMOSTRANSPORT_DATA_ROOT/met/c90_l66"
start_date = "2014-09-01"
end_date = "2024-12-31"
file_pattern = "era5_n320_transport_{YYYYMMDD}_float32.bin"

[advection]
scheme = "ppm"

[tracers.co2_clm_gpp]
  [tracers.co2_clm_gpp.init]
  kind = "uniform"
  background = 1.3e-3

  [tracers.co2_clm_gpp.surface_flux]
  kind = "cs_native"
  file = "$ATMOSTRANSPORT_DATA_ROOT/fluxes/trendy_v2/TRENDYv14_S3_CLM_gpp_ter_nee_daily_co2flux_c90_2014_2024.nc"
  variable = "GPP_CO2_FLUX"
  molar_mass_kg_mol = 0.0440095
  time_varying = true
  temporal_scheme = "stepwise"

[tracers.co2_clm_ra]
  [tracers.co2_clm_ra.init]
  kind = "uniform"
  background = 1.0e-5

  [tracers.co2_clm_ra.surface_flux]
  kind = "cs_native"
  file = "$ATMOSTRANSPORT_DATA_ROOT/fluxes/trendy_v2/TRENDYv14_S3_CLM_gpp_ter_nee_daily_co2flux_c90_2014_2024.nc"
  variable = "RA_CO2_FLUX"
  molar_mass_kg_mol = 0.0440095
  time_varying = true
  temporal_scheme = "stepwise"

[tracers.co2_clm_rh]
  [tracers.co2_clm_rh.init]
  kind = "uniform"
  background = 1.0e-5

  [tracers.co2_clm_rh.surface_flux]
  kind = "cs_native"
  file = "$ATMOSTRANSPORT_DATA_ROOT/fluxes/trendy_v2/TRENDYv14_S3_CLM_gpp_ter_nee_daily_co2flux_c90_2014_2024.nc"
  variable = "RH_CO2_FLUX"
  molar_mass_kg_mol = 0.0440095
