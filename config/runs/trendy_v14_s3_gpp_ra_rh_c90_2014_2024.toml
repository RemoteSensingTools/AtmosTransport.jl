  file = "$ATMOSTRANSPORT_DATA_ROOT/fluxes/trendy_v2/TRENDYv14_S3_ORCHIDEE_gpp_ter_nee_daily_co2flux_c90_2014_2024.nc"
  variable = "NEE_CO2_FLUX"
  molar_mass_kg_mol = 0.0440095
  time_varying = true
  temporal_scheme = "stepwise"

[diffusion]
kind = "tm5_dkg"
surface_flux_boundary = true

[convection]
kind = "none"

[output]
format = "netcdf"
split = "daily"
snapshot_interval_hours = 24
path = "$ATMOSTRANSPORT_DATA_ROOT/output/trendy_oco2era_c90/trendy_oco2era_c90_{YYYYMMDD}.nc"
deflate_level = 1
shuffle = true

[output.fields]
tracers = ["co2_clm_gpp", "co2_clm_ra", "co2_clm_rh", "co2_clm_nee", "co2_jules_es_gpp", "co2_jules_es_ra", "co2_jules_es_rh", "co2_jules_es_nee", "co2_orchidee_gpp", "co2_orchidee_ra", "co2_orchidee_rh", "co2_orchidee_nee"]
layers = "none"
column_mean = true
column_mass_per_area = false
air_mass_layers = "none"
air_mass = false
air_mass_per_area = false
column_air_mass_per_area = false
