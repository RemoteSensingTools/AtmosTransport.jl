  variable = "RH_CO2_FLUX"
  molar_mass_kg_mol = 0.0440095
  time_varying = true
  temporal_scheme = "stepwise"

[tracers.co2_jules_es_nee]
  [tracers.co2_jules_es_nee.init]
  kind = "uniform"
  background = 2.0e-4

  [tracers.co2_jules_es_nee.surface_flux]
  kind = "cs_native"
  file = "$ATMOSTRANSPORT_DATA_ROOT/fluxes/trendy_v2/TRENDYv14_S3_JULES-ES_gpp_ter_nee_daily_co2flux_c90_2014_2024.nc"
  variable = "NEE_CO2_FLUX"
  molar_mass_kg_mol = 0.0440095
  time_varying = true
  temporal_scheme = "stepwise"

[tracers.co2_orchidee_gpp]
