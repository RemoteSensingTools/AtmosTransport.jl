# EXPERIMENTAL full-year C30 runtime benchmark. Advection/PBL are nested
# C90->C30 operator restrictions; convection is the legacy CATRINE 1-degree,
# three-hour TM5 archive mapped to C30. Runtime benchmarking only.

[input]
folder       = "/temp2/catrine-runs/met/era5_c30_2021_fullphysics_experimental"
start_date   = "2021-01-01"
end_date     = "2021-12-31"
file_pattern = "era5_c30_transport_{YYYYMMDD}_float32.bin"

[architecture]
use_gpu = true
backend = "cuda"

[numerics]
float_type = "Float32"

[advection]
scheme = "ppm"

[tracers.co2_natural]
  [tracers.co2_natural.init]
  kind = "catrine_co2"
  [tracers.co2_natural.surface_flux]
  kind = "lmdz_co2"
  time_varying = true
  temporal_scheme = "stepwise"

[tracers.co2_fossil]
  [tracers.co2_fossil.init]
  kind = "uniform"
  background = 0.0
  [tracers.co2_fossil.surface_flux]
  kind = "gridfed_fossil_co2"
  time_index = 1

[tracers.sf6]
  [tracers.sf6.init]
  kind = "file"
  file = "~/data/AtmosTransport/catrine/InitialConditions/startSF6_202112010000.nc"
  variable = "SF6"
  [tracers.sf6.surface_flux]
  kind = "edgar_sf6"
  scale = 1.0116635

[tracers.rn222]
  [tracers.rn222.init]
  kind = "uniform"
  background = 0.0
  [tracers.rn222.surface_flux]
  kind = "zhang_rn222"
  time_index = 1

[diffusion]
kind = "tm5_dkg"
surface_flux_boundary = true

[convection]
kind = "tm5"
tile_workspace_gib = 0.25
use_collab_lu = true
lmax_conv = 66
n_merge = 1

[chemistry]
kind = "decay"
  [chemistry.half_lives_seconds]
  rn222 = 330350.4

[output]
format = "binary_mmap"
split = "daily"
snapshot_interval_hours = 3
snapshot_file = "/temp2/catrine-runs/output/catrine_c30_2021_fullphysics_experimental/catrine_c30_fullphys_{YYYYMMDD}.atmsnap"
