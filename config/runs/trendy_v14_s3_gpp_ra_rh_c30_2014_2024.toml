  [tracers.co2_jules_es_nee.surface_flux]
  kind = "cs_native"
  file = "$ATMOSTRANSPORT_DATA_ROOT/fluxes/trendy_c30/TRENDYv14_S3_JULES-ES_gpp_ter_nee_daily_co2flux_c30_2014_2024.nc"
  variable = "NEE_CO2_FLUX"
