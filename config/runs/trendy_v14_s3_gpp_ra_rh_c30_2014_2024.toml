# TRENDYv14 S3 GPP/Ra/Rh/NEE over the full OCO-2 era on C30,
# 2014-09-01 .. 2024-12-31. Met: spandey era5 C30/L66 format-4 archive
# (2014-2025 complete, dry basis, DKG diffusion + PBL, no convection --
# header-verified uniform). 12 tracers in one run; carriers sized for the
# 10.3-yr window (GPP up to ~770 ppm drawdown -> 1300 ppm carrier).
# Fluxes: prepare_trendy_s3_multiyear_c90.py --tag c30 with the C30 geometry
# taken from a catrine C30 model-output file (authoritative native corners).

[architecture]
use_gpu = true
backend = "cuda"

[numerics]
float_type = "Float32"

[input]
folder = "$ATMOSTRANSPORT_DATA_ROOT/met/c30_l66"
start_date = "2014-09-01"
end_date = "2024-12-31"
file_pattern = "era5_c30_transport_{YYYYMMDD}_float32.bin"

[advection]
scheme = "ppm"

[tracers.co2_clm_gpp]
  [tracers.co2_clm_gpp.init]
  kind = "uniform"
  background = 1.3e-3

  [tracers.co2_clm_gpp.surface_flux]
  kind = "cs_native"
  file = "$ATMOSTRANSPORT_DATA_ROOT/fluxes/trendy_c30/TRENDYv14_S3_CLM_gpp_ter_nee_daily_co2flux_c30_2014_2024.nc"
  variable = "GPP_CO2_FLUX"
  molar_mass_kg_mol = 0.0440095
  time_varying = true
  temporal_scheme = "stepwise"

[tracers.co2_clm_ra]
  [tracers.co2_clm_ra.init]
  kind = "uniform"
  background = 1.0e-5

  [tracers.co2_clm_ra.surface_flux]
  kind = "cs_native"
  file = "$ATMOSTRANSPORT_DATA_ROOT/fluxes/trendy_c30/TRENDYv14_S3_CLM_gpp_ter_nee_daily_co2flux_c30_2014_2024.nc"
  variable = "RA_CO2_FLUX"
  molar_mass_kg_mol = 0.0440095
  time_varying = true
  temporal_scheme = "stepwise"

[tracers.co2_clm_rh]
  [tracers.co2_clm_rh.init]
  kind = "uniform"
  background = 1.0e-5

  [tracers.co2_clm_rh.surface_flux]
  kind = "cs_native"
  file = "$ATMOSTRANSPORT_DATA_ROOT/fluxes/trendy_c30/TRENDYv14_S3_CLM_gpp_ter_nee_daily_co2flux_c30_2014_2024.nc"
