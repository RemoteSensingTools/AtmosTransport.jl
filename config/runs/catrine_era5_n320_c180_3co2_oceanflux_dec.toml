# ===========================================================================
# Three-CO2-tracer ERA5-N320 -> C180 December run: natural (LMDZ/CAMS) +
# fossil (GridFED) + OCEAN (ECCO-Darwin v5 air-sea CO2 flux), to gauge how
# large the ocean-driven XCO2 signal/variation is over a month.
#
# Met: the adaptive-substep, dry-mass-pinned Dec 1-31 2021 ERA5 N320 -> C180
# transport binaries (exact TM5 :dkg diffusion + four-field convection baked in),
# same as catrine_era5_n320_c180_tm5diff_dec2021_2weeks.toml.
#
# Ocean flux: ECCO-Darwin v5 daily fluxCO2 (LLC270, NASA NAS), one December
# averaged to a monthly mean, sign-flipped to "+into atmosphere", converted to
# kgCO2/m2/s, binned to 0.5deg lat-lon (scripts/preprocessing/
# eccodarwin_co2flux_to_latlon.py). Driven as a STATIC monthly flux (like
# GridFED fossil) via the generic file-based surface-flux path. The flux month
# need not match the met month (representative December pattern).
#
# HISTORICAL NOTE (co2_ocean IC = 400 ppm): this run predates signed monotone
# advection and used a positive reference carrier to keep the old zero-referenced
# moment limiter inactive. The production `scheme="ppm"` path does not call the
# dormant FV3 `fillz_panels!` vertical-remap helper. New anomaly runs may start
# this tracer at zero and retain negative ocean uptake directly; this archived
# configuration keeps 400 ppm only so its existing outputs remain reproducible.
#
# Runner:
#   julia --project=. scripts/run_transport.jl \
#       config/runs/catrine_era5_n320_c180_3co2_oceanflux_dec.toml
# ===========================================================================

[architecture]
use_gpu = true
backend = "cuda"

[numerics]
float_type = "Float32"

[input]
folder       = "~/data/AtmosTransport/met/era5/n320_to_c180/transport_binary_dec2021_catrine_f32"
start_date   = "2021-12-01"
end_date     = "2021-12-31"
file_pattern = "era5_n320_transport_{YYYYMMDD}_float32.bin"

[advection]
scheme = "ppm"

[tracers.co2_natural]
  [tracers.co2_natural.init]
  kind = "catrine_co2"
  [tracers.co2_natural.surface_flux]
  kind = "lmdz_co2"

[tracers.co2_fossil]
  [tracers.co2_fossil.init]
  kind = "uniform"
  background = 0.0
  [tracers.co2_fossil.surface_flux]
  kind = "gridfed_fossil_co2"
  time_index = 12

# Ocean air-sea CO2 flux (ECCO-Darwin v5). IC = 400 ppm background (4.0e-4 dry
# VMR) so the transported field stays positive and the positive-definite vertical
# remap / fillz stay inert; subtract 400 ppm in post to get the ocean anomaly.
# Units in the NetCDF are kgCO2/m2/s (already +into atmosphere), so no unit conv.
[tracers.co2_ocean]
  [tracers.co2_ocean.init]
  kind = "uniform"
  background = 4.0e-4
  [tracers.co2_ocean.surface_flux]
  kind = "file"   # ECCO-Darwin air-sea CO2 flux (generic NetCDF)
  file = "~/data/AtmosTransport/catrine/Emissions/ECCO_Darwin/eccodarwin_ocean_co2_december_05deg.nc"
  variable = "co2_flux_ocean"
  # generic file kind isn't in the known-tracer molar-mass map; declare CO2's
  # so the kgCO2/m2/s flux converts to the dry-VMR storage basis.
  molar_mass_kg_mol = 0.0440095

[diffusion]
kind = "tm5_dkg"
surface_flux_boundary = true

[convection]
kind = "tm5"
use_collab_lu = true
lmax_conv = 85
n_merge = 1

[output]
format = "binary_mmap"
split = "daily"
snapshot_interval_hours = 3
snapshot_file = "~/data/AtmosTransport/output/ocean_co2_dec_posIC/catrine_era5_n320_3co2_oceanflux_{YYYYMMDD}.atmsnap"
