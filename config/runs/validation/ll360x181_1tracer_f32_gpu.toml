# 1-degree LatLon, single CO2 tracer, F32 GPU — baseline validation
#
# Usage:
#   CUDA_VISIBLE_DEVICES=0 julia --project=. scripts/run_transport.jl \
#       config/runs/validation/ll360x181_1tracer_f32_gpu.toml

[input]
binary_paths = [
    "~/data/AtmosTransport/met/era5/ll360x181/transport_binary_v2_tropo34_dec2021_f64/era5_transport_20211201_merged1000Pa_float64.bin",
    "~/data/AtmosTransport/met/era5/ll360x181/transport_binary_v2_tropo34_dec2021_f64/era5_transport_20211202_merged1000Pa_float64.bin",
]

[architecture]
use_gpu = true

[numerics]
float_type = "Float32"

[run]
air_mass_reset_mode = "none"

[advection]
scheme = "slopes"

[tracers.co2]
[tracers.co2.init]
kind = "uniform"
background = 411e-6

[output]
snapshot_hours = [0, 12, 24, 36, 48]
snapshot_file = "~/data/AtmosTransport/output/validation/ll360x181_1tracer_f32_gpu.nc"
