# --- LatLon 96x48 (3.75 deg) advection-only validation --- F32 CPU ---
#
# Usage:
#   julia --project=. scripts/run_transport.jl \
#       config/runs/validation/ll96x48_advonly_f32_cpu.toml

[input]
binary_paths = [
    "~/data/AtmosTransport/met/era5/ll96x48/transport_binary_v2_tropo34_dec2021_f64/era5_transport_20211201_merged1000Pa_float64.bin",
    "~/data/AtmosTransport/met/era5/ll96x48/transport_binary_v2_tropo34_dec2021_f64/era5_transport_20211202_merged1000Pa_float64.bin",
]

[architecture]
use_gpu = false

[numerics]
float_type = "Float32"

[run]
air_mass_reset_mode = "none"

[advection]
scheme = "slopes"

[tracers.co2]
[tracers.co2.init]
kind = "catrine_co2"

[tracers.fossil_co2]
[tracers.fossil_co2.init]
kind = "uniform"
background = 0.0

[tracers.sf6]
[tracers.sf6.init]
kind = "file"
file = "~/data/AtmosTransport/catrine/InitialConditions/startSF6_202112010000.nc"
variable = "SF6"

[output]
snapshot_hours = [0, 6, 12, 24, 36, 48]
snapshot_file = "~/data/AtmosTransport/output/validation/ll96x48_advonly_f32_cpu.nc"
