# --- Reduced Gaussian N24 (4608 cells) advection-only validation --- F32 GPU ---
#
# Usage:
#   julia --project=. scripts/run_transport.jl \
#       config/runs/validation/rgN24_advonly_f32_gpu.toml

[input]
binary_paths = [
    "~/data/AtmosTransport/met/era5/rgN24/transport_binary_v2_tropo34_dec2021_f64/era5_transport_20211201_merged1000Pa_float64.bin",
    "~/data/AtmosTransport/met/era5/rgN24/transport_binary_v2_tropo34_dec2021_f64/era5_transport_20211202_merged1000Pa_float64.bin",
]

[architecture]
use_gpu = true

[numerics]
float_type = "Float32"

[run]
air_mass_reset_mode = "none"

[advection]
scheme = "upwind"

[tracers.co2]
[tracers.co2.init]
kind = "catrine_co2"

[tracers.fossil_co2]
[tracers.fossil_co2.init]
kind = "uniform"
background = 0.0

[tracers.sf6]
[tracers.sf6.init]
kind = "file"
file = "~/data/AtmosTransport/catrine/InitialConditions/startSF6_202112010000.nc"
variable = "SF6"

[output]
snapshot_hours = [0, 6, 12, 24, 36, 48]
snapshot_file = "~/data/AtmosTransport/output/validation/rgN24_advonly_f32_gpu.nc"
