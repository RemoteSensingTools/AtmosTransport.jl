# Full-year C90 transport of 23 TRENDYv14 S3 models as 46 independent
# atmospheric CO2 tracers: one GPP uptake tracer and one TER source tracer
# per model. Drivers conserve each model's monthly totals; GPP uses the
# prescribed FLUXCOM-X diurnal timing, while TER is daily-mean (no diurnal
# cycle). See docs/memos/TRENDYV14_S3_C90_FLUX_DRIVERS_2021_ATBD.md.
#
# Every tracer uses a 400 ppm numerical carrier. Subtract 400 ppm from output
# VMRs to obtain the transported contribution of that model/flux component.
# Meteorology is C90/L137 ERA5-N320 advection plus TM5 DKG diffusion, without
# convection.

[architecture]
use_gpu = true
backend = "cuda"

[numerics]
float_type = "Float32"

[input]
folder = "~/data/AtmosTransport/met/era5/n320_to_c90/transport_binary_v4_l137_f32_no_convection"
start_date = "2021-01-01"
end_date = "2021-12-31"
file_pattern = "era5_n320_transport_{YYYYMMDD}_float32.bin"

[advection]
scheme = "ppm"

# TRENDY model: CABLE-POP; component: GPP
[tracers.co2_trendy_cable_pop_gpp]
  [tracers.co2_trendy_cable_pop_gpp.init]
  kind = "uniform"
  background = 4.0e-4
  [tracers.co2_trendy_cable_pop_gpp.surface_flux]
  kind = "cs_native"
  file = "/kiwi-data/Data/groupMembers/cfranken/AtmosTransport/fluxes/TRENDYv14/S3/C90/2021/TRENDYv14_S3_CABLE-POP_gpp_diurnal_ter_daily_hourly_co2flux_c90_2021.nc"
  variable = "GPP_CO2_FLUX"
  molar_mass_kg_mol = 0.0440095
  time_varying = true
  temporal_scheme = "stepwise"

# TRENDY model: CABLE-POP; component: TER
