# Portable one-tracer example for a daily SIF-derived GPP CO2 flux on the
# GEOS-native C90 grid. Set ATMOSTRANSPORT_DATA_ROOT before launching.
#
# The C90/L66 transport binaries contain advection, pressure, PBL fields, and
# exact TM5 DKG diffusion, but no convection mass fluxes. Convection must
# therefore remain disabled for this binary collection.

[architecture]
use_gpu = true
backend = "auto"  # CUDA on wurst; Metal on Apple Silicon

[numerics]
float_type = "Float32"

[input]
folder = "$ATMOSTRANSPORT_DATA_ROOT/met/c90_l66"
start_date = "2021-01-01"
end_date = "2021-12-31"
file_pattern = "era5_n320_transport_{YYYYMMDD}_float32.bin"

[advection]
scheme = "ppm"

[tracers.co2_sif_gpp]
  [tracers.co2_sif_gpp.init]
  # A carrier keeps the tracer positive while the GPP source removes CO2.
  # Subtract 400 ppm (4e-4 mol/mol) from output VMR/XCO2 to obtain the
  # transported GPP contribution.
  kind = "uniform"
  background = 4.0e-4

  [tracers.co2_sif_gpp.surface_flux]
  kind = "cs_native"
  file = "$ATMOSTRANSPORT_DATA_ROOT/fluxes/sif_gpp_daily_co2flux_c90_2021.nc"
  variable = "GPP_CO2_FLUX"
  molar_mass_kg_mol = 0.0440095
  time_varying = true
  temporal_scheme = "stepwise"

[diffusion]
kind = "tm5_dkg"
surface_flux_boundary = true

[convection]
kind = "none"

[output]
format = "netcdf"
split = "daily"
snapshot_interval_hours = 24
path = "$ATMOSTRANSPORT_DATA_ROOT/output/sif_gpp_c90_2021/sif_gpp_c90_{YYYYMMDD}.nc"
deflate_level = 1
shuffle = true

[output.fields]
tracers = ["co2_sif_gpp"]
layers = "none"
column_mean = true
column_mass_per_area = false
air_mass_layers = "none"
air_mass = false
air_mass_per_area = false
column_air_mass_per_area = false
