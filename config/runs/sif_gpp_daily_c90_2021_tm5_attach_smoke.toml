# One-day validation of a C90/L66 binary after attaching legacy 1-degree,
# 3-hourly CATRINE TM5 convection.

[architecture]
use_gpu = true
backend = "cuda"

[numerics]
float_type = "Float32"

[input]
folder = "/temp2/c90-tm5-attach-test"
start_date = "2021-01-01"
end_date = "2021-01-01"
file_pattern = "era5_n320_transport_{YYYYMMDD}_float32.bin"

[advection]
scheme = "ppm"

[tracers.co2_sif_gpp]
  [tracers.co2_sif_gpp.init]
  kind = "uniform"
  background = 4.0e-4
  [tracers.co2_sif_gpp.surface_flux]
  kind = "cs_native"
  file = "/kiwi-data/Data/satellite/FLUXCOM-X/X-BASE/2021/pilot/sif_gpp_daily_co2flux_c90_2021.nc"
  variable = "GPP_CO2_FLUX"
  molar_mass_kg_mol = 0.0440095
  time_varying = true
  temporal_scheme = "stepwise"

[diffusion]
kind = "tm5_dkg"
surface_flux_boundary = true

[convection]
kind = "tm5"
tile_workspace_gib = 0.25
use_collab_lu = true
lmax_conv = 66
n_merge = 1

[output]
format = "netcdf"
split = "daily"
snapshot_interval_hours = 24
path = "/temp2/c90-tm5-attach-test/output/sif_gpp_c90_tm5_{YYYYMMDD}.nc"
deflate_level = 1
shuffle = true

[output.fields]
tracers = ["co2_sif_gpp"]
layers = "none"
column_mean = true
column_mass_per_area = false
air_mass_layers = "none"
air_mass = false
air_mass_per_area = false
column_air_mass_per_area = false
