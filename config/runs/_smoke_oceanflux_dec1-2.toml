# 2-day smoke of the 3-CO2-tracer ocean-flux ERA5 C180 run: validates that the
# new co2_ocean tracer (ECCO-Darwin flux) loads, regrids, and produces a sane
# signal before launching the full month. See
# catrine_era5_n320_c180_3co2_oceanflux_dec.toml for the production config.

[architecture]
use_gpu = true
backend = "cuda"

[numerics]
float_type = "Float32"

[input]
folder       = "~/data/AtmosTransport/met/era5/n320_to_c180/transport_binary_dec2021_catrine_f32"
start_date   = "2021-12-01"
end_date     = "2021-12-02"
file_pattern = "era5_n320_transport_{YYYYMMDD}_float32.bin"

[advection]
scheme = "ppm"

[tracers.co2_natural]
  [tracers.co2_natural.init]
  kind = "catrine_co2"
  [tracers.co2_natural.surface_flux]
  kind = "lmdz_co2"

[tracers.co2_fossil]
  [tracers.co2_fossil.init]
  kind = "uniform"
  background = 0.0
  [tracers.co2_fossil.surface_flux]
  kind = "gridfed_fossil_co2"
  time_index = 12

[tracers.co2_ocean]
  [tracers.co2_ocean.init]
  kind = "uniform"
  # Keep the signed ocean anomaly on a positive carrier so FV3 fillz remains
  # inert; subtract 400 ppm during diagnostics.
  background = 4.0e-4
  [tracers.co2_ocean.surface_flux]
  kind = "file"   # ECCO-Darwin air-sea CO2 flux (generic NetCDF)
  file = "~/data/AtmosTransport/catrine/Emissions/ECCO_Darwin/eccodarwin_ocean_co2_december_05deg.nc"
  variable = "co2_flux_ocean"
  molar_mass_kg_mol = 0.0440095

[diffusion]
kind = "tm5_dkg"
surface_flux_boundary = true

[convection]
kind = "tm5"
use_collab_lu = true
lmax_conv = 85
n_merge = 1

[output]
format = "binary_mmap"
split = "daily"
snapshot_interval_hours = 3
snapshot_file = "~/data/AtmosTransport/output/ocean_co2_smoke/smoke_oceanflux_{YYYYMMDD}.atmsnap"
