# ===========================================================================
# ARCHIVED FAILED VALIDATION — full OMEGA replacement corrupts PBL transport.
# Pre-campaign gate: run Dec 1-2 2021, then R^2 + slope of the full 3D fields
# vs GEOS-Chem per timestep (scripts/diagnostics/heritage/r2_slope_3d_vs_geoschem.py).
# Identical physics/tracer setup to the Dec 2021-Feb 2022 campaign config
# (geosit_omega_4tracer_fullphys.toml); only the date range + output cadence
# (hourly here, for the diurnal-resolving R^2 check) differ.
#
# Carries the two emission fixes verified against GC:
#   * co2_natural: time_varying = true + temporal_scheme = "stepwise"
#     (piecewise-constant CAMS hold = GC/HEMCO's exact treatment; no time shift).
#   * sf6: scale = 1.0116635 -> matches GC's 10.10 kt/yr (Catrine protocol).
#
#   julia --project=. scripts/run_transport.jl \
#       config/runs/campaign_winter2021/geosit_omega_4tracer_val_dec1-2.toml
# ===========================================================================

[architecture]
use_gpu = true
backend = "cuda"

[numerics]
float_type = "Float32"

[input]
folder       = "~/data/AtmosTransport/met/geosit/C180/transport_binary_dec2021_catrine_f32_fullL72_omega"
start_date   = "2021-12-01"
end_date     = "2021-12-02"
file_pattern = "geos_transport_{YYYYMMDD}_float32.bin"

[advection]
scheme = "ppm"

[tracers.co2_natural]
  [tracers.co2_natural.init]
  kind = "catrine_co2"
  [tracers.co2_natural.surface_flux]
  kind            = "lmdz_co2"
  time_varying    = true            # diurnal CAMS biospheric flux (REQUIRED for the diurnal cycle)
  temporal_scheme = "stepwise"      # piecewise-constant hold = GC/HEMCO's exact CAMS treatment (verified vs EmisCO2_Total)

[tracers.co2_fossil]
  [tracers.co2_fossil.init]
  kind = "uniform"            # fossil CO2 is a perturbation tracer: 0 at t=0
  background = 0.0            # GC also starts at 0; its first output (03z) = 3h of flux
  [tracers.co2_fossil.surface_flux]
  kind = "gridfed_fossil_co2"
  time_index = 12

[tracers.sf6]
  [tracers.sf6.init]
  kind = "file"
  file = "~/data/AtmosTransport/catrine/InitialConditions/startSF6_202112010000.nc"
  variable = "SF6"
  [tracers.sf6.surface_flux]
  kind = "edgar_sf6"
  scale = 1.0116635                 # match GC 10.10 kt/yr (Catrine protocol)

[tracers.rn222]
  [tracers.rn222.init]
  kind = "uniform"            # Rn222 also starts at 0 (spins up via emission - decay)
  background = 0.0
  [tracers.rn222.surface_flux]
  kind = "zhang_rn222"
  time_index = 12

[diffusion]
kind = "geoschem_holtslag_boville_vdiff"
surface_flux_boundary = true

[convection]
kind = "cmfmc_matrix"
tile_workspace_gib = 0.25
use_collab_lu = true
lmax_conv = 0

[chemistry]
kind = "decay"
  [chemistry.half_lives_seconds]
  rn222 = 330350.4

[output]
snapshot_interval_hours = 1         # hourly, to resolve the diurnal cycle for R^2/slope
snapshot_file = "~/data/AtmosTransport/output/campaign_winter2021/geosit_omega_4tracer_val_dec1-2.nc"
