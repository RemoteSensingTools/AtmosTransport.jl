# Catrine LL 720×361 3-day reference — ADVECTION + DIFFUSION + CONVECTION
#
# NOT RUNNABLE AS IS: TM5Convection needs entu/detu/entd/detd sections, and
# no preprocessing route now writes them on a lat-lon grid. The ERA5 spectral
# `[tm5_convection]` route that did (plan 24) placed the fields 180° off in
# longitude and one hour early and was removed (issue #55); readers reject
# lat-lon binaries that carry its sections. Kept for provenance.
#
# Runner:   julia -t8 --project=. scripts/run_transport.jl \
#               config/runs/catrine_ll720_3d/advdiffconv.toml

[input]
folder       = "~/data/AtmosTransport/met/era5/ll720x361_v4/transport_binary_v2_tropo34_dec2021_f64/"
start_date   = "2021-12-01"
end_date     = "2021-12-03"
file_pattern = "era5_transport_{YYYYMMDD}_merged1000Pa_float64.bin"

[architecture]
use_gpu = true

[numerics]
float_type = "Float32"

[advection]
scheme = "slopes"

[tracers.co2_natural]
[tracers.co2_natural.init]
kind = "catrine_co2"

[tracers.co2_fossil]
[tracers.co2_fossil.init]
kind = "uniform"
background = 0.0

[diffusion]
kind  = "constant"
value = 1.0

[convection]
kind = "tm5"

[output]
snapshot_hours = [0, 6, 12, 18, 24, 30, 36, 42, 48, 54, 60, 66, 72]
snapshot_file = "~/data/AtmosTransport/output/catrine_ll720_3d/advdiffconv.nc"
