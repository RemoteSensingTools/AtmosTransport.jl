# ===========================================================================
# ERA5 N320 native GRIB (ARCO-assembled) — Met Data Source Configuration
#
# ARCO variant of era5_n320.toml. The `core` GRIB is the concatenation of
# Google ARCO-ERA5's dve+tw+o3q model-level files (spectral VO/D/T + reduced-
# Gaussian Q), which — unlike the CDS `core` bundle — carries NO spectral
# `lnsp`. `arco_surface_pressure = true` makes the reader source surface
# pressure from the ARCO single_level netCDF
# (`sfc_an_native/arco/YYYYMMDD/surface_pressure.nc`, 0.25° `sp`) interpolated
# to N320 instead of synthesising `lnsp`.
#
# NOTE: surface/convection/diffusion are OFF here (core+PS advection binary).
# Enabling include_convection needs per-day convection GRIB from CDS
# (era5_convection_only.toml, split with grib_copy); include_tm5_diffusion
# additionally needs the ARCO single_level surface bundle assembled for
# `era5_surface_reader.jl`. Those wire in once their ARCO paths land.
# ===========================================================================

[source]
name        = "ERA5-N320"
description = "ECMWF ERA5 — native N320 GRIB assembled from Google ARCO-ERA5"
institution = "ECMWF (data) / Google Research (ARCO mirror)"
reference   = "https://github.com/google-research/arco-era5"

[vertical]
coefficients_file = "config/era5_L137_coefficients.toml"

[preprocessing]
# ARCO core carries no spectral lnsp → source PS from ARCO single_level sp.
arco_surface_pressure = true

# Optional GRIB streams — OFF for the core+PS advection binary (see header).
include_surface       = false
include_convection    = false
include_tm5_diffusion = false
