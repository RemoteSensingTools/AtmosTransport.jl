# ===========================================================================
# MERRA-2 wind-derived → C180 GEOS-native cubed-sphere preprocess
# (Dec 2021).
#
# Reproduces the validated GEOS-Chem CO₂ transport input path: derive the
# horizontal mass fluxes from MERRA-2 WINDS (tavg3 U/V) + a Cameron-Smith
# column pressure-fix (the Poisson balance), instead of GEOS native
# cubed-sphere MFXC. Purely additive — the GEOS-native and ERA5 paths are
# untouched.
#
# Drives the unified CLI:
#   julia -t 14 --project=. scripts/preprocessing/preprocess_transport_binary.jl \
#       config/preprocessing/merra2_c180_dec2021_f32.toml \
#       --start 2021-12-02 --end 2021-12-31
#
# Per-window pipeline (8 × 3-hourly windows; wired in
# `transport_binary/merra2_latlon_regrid.jl`):
#
#   1. Read native MERRA-2 LL fields — PS/QV from inst3 slice `win`
#      (instantaneous mass endpoint), U/V from tavg3 slice `win`
#      (3-hr time-AVERAGE advecting winds). MERRA-2 is top-down (no flip).
#   2. Conservative regrid of PS / U / V / QV from 576×361 LL to C180.
#   3. Hybrid-σ dry-mass derivation on C180 (GEOS L72 endpoint convention).
#   4. Panel-local wind rotation + Arakawa-C face flux reconstruction.
#   5. Per-window Poisson balance = the Cameron-Smith column pressure-fix.
#   6. Streaming write through the v4 transport-binary writer.
#
# Source-descriptor knobs (winds_collection / include_*) live in
# `config/met_sources/merra2.toml`.
# ===========================================================================

[source]
toml     = "config/met_sources/merra2.toml"
root_dir = "/home/cfranken/data/AtmosTransport/met/merra2"

[vertical]
coefficients = "config/geos_L72_coefficients.toml"
transform    = "identity"        # full native L72 — no top merge

[output]
directory  = "/home/cfranken/data/AtmosTransport/met/merra2/c180/transport_binary_dec2021_f32"
mass_basis = "dry"

[grid]
type                = "cubed_sphere"
Nc                  = 180
panel_convention    = "geos_native"
definition          = "gmao_equal_distance"
regridder_cache_dir = "~/.cache/AtmosTransport/cr_regridding"

[numerics]
float_type     = "Float32"
dt_met_seconds = 10800.0          # MERRA-2 is 3-hourly
# MERRA-2 days are independent — the final-window look-ahead reads next-day
# inst3 slice-1 directly, and process_day returns no seed (final_m=nothing),
# so no cross-day mass chaining occurs. chain_mass=false is correct here AND
# is what lets the unified driver day-thread (the threading gate requires
# !chain_mass).
chain_mass     = false

positivity_cfl_limit       = 0.95
require_substep_positivity = true
substep_schedule           = "adaptive_cfl"
substep_cfl_target         = 0.95
min_steps_per_window       = 1
max_steps_per_window       = 512   # headroom for the unmerged mesospheric top

[mass_fix]
# Global dry-air mass pin — mirror of the GEOS-CS / ERA5 N320 path. Removes the
# residual global-mean dry-mass drift, pinning the MEASURED C180 dry mass to a
# fixed absolute target shared with the GEOS path so the driver families share
# one dry-air baseline. See docs/src/theory/mass_conservation.md.
enable           = true
mode             = "target_ps_dry"
