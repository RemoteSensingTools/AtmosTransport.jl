# ===========================================================================
# GEOS-IT C180 native -> v4 CS C180, Dec 2021, MERGED top, full physics —
# `:pfix_corrected` cm closure (candidate SH-UTLS fingering FIX).
#
# Native pressure-fixer cm (smooth) + a ZERO-SUM SPATIAL LOW-PASS dry-mass
# correction toward the analyzed dry-PS (generalizes the scalar global-mass pin
# into a spatially-resolved pattern). Keeps hourly MFXC; cm stays at the smooth
# pressure-fixer floor; the large-scale drift is corrected (prevents the pure
# pressure-fixer blow-up) and the global dry mass lands on the analyzed target;
# only the grid-scale residual is left as a small bounded mass perturbation, NOT
# advected into cm. chain_mass=true so the pf endpoint chains continuously and
# the correction relaxes it toward analysis each window.
#
# Usage:
#   setsid nohup julia -t14 --project=. \
#       scripts/preprocessing/preprocess_transport_binary.jl \
#       config/preprocessing/geosit_c180_dec2021_catrine_f32_pfixcorrected.toml \
#       --start 2021-12-11 --end 2021-12-11 \
#     > ~/atmostransport_logs/geosit_c180_dec2021_pfixcorrected_<ts>.log 2>&1 &
# ===========================================================================

[source]
toml                 = "config/met_sources/geosit.toml"
root_dir             = "/home/cfranken/data/AtmosTransport/met/geosit/C180/raw_catrine"
include_surface      = true
include_convection   = true
include_vdiff_fields = true

[output]
directory  = "/home/cfranken/data/AtmosTransport/met/geosit/C180/transport_binary_dec2021_catrine_f32_pfixcorrected"
mass_basis = "dry"

[grid]
type                = "cubed_sphere"
Nc                  = 180
panel_convention    = "geos_native"
definition          = "gmao_equal_distance"
regridder_cache_dir = "~/.cache/AtmosTransport/cr_regridding"

[vertical]
coefficients = "config/geos_L72_coefficients.toml"
transform    = "merge_above_pressure"
pressure_hPa = 0.25

[numerics]
float_type     = "Float32"
dt_met_seconds = 3600.0
chain_mass     = false     # re-anchor to analyzed each window (no accumulation; clean windows 1-8)

positivity_cfl_limit       = 0.95
require_substep_positivity = true
substep_schedule           = "adaptive_cfl"
substep_cfl_target         = 0.95
min_steps_per_window       = 1
max_steps_per_window       = 64

# --- SH-UTLS fingering fix (candidate) ---
geos_cm_closure                   = "pfix_corrected"
geos_moisture_filter_smooth_iters = 8   # spatial low-pass cutoff (~3-cell)

[mass_fix]
enable = true
mode = "target_ps_dry"
