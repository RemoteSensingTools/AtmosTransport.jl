# ERA5 spectral -> LL 720x361 transport binary with the CFL-oriented
# ml137_cfl85 vertical merge, TM5 convection, and raw PBL surface fields.
#
# This is the source binary for ERA5 -> GEOS-native C180 comparisons where we
# want the same horizontal cubed-sphere geometry as GEOS-IT but fewer upper
# ERA5 layers than full L137.
#
# Usage:
#   julia -t16 --project=. scripts/preprocessing/preprocess_transport_binary.jl \
#       config/preprocessing/era5_ll720x361_cfl85_dec2021_f32_tm5_surface.toml \
#       --day 2021-12-02

[input]
spectral_dir = "~/data/AtmosTransport/met/era5/0.5x0.5/spectral_hourly"
thermo_dir   = "~/data/AtmosTransport/met/era5/0.5x0.5/physics"
surface_dir  = "~/data/AtmosTransport/met/era5/0.5x0.5/surface"
coefficients = "config/era5_L137_coefficients.toml"

[output]
directory  = "~/data/AtmosTransport/met/era5/ll720x361_v4/transport_binary_v2_cfl85_dec2021_f32_tm5_surface"
mass_basis = "dry"
include_qv = false

[grid]
type                   = "latlon"
nlon                   = 720
nlat                   = 361
level_top              = 1
level_bot              = 137
echlevs                = "ml137_cfl85"
merge_min_thickness_Pa = 1000.0

[numerics]
float_type   = "Float32"
dt           = 900.0
met_interval = 3600.0

[mass_fix]
enable                = true
qv_global_climatology = 0.00247

[surface]
enable = true

[tm5_convection]
enable          = true
physics_bin_dir = "~/data/AtmosTransport/met/era5/0.5x0.5/physics_bin"
