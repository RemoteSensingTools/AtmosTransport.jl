# ---------------------------------------------------------------------------
# cs_observations_v2 — NetCDF schema for the observations of the CS 4D-Var
# inversion (`read_observations` / `write_observations`, bound to the model by
# `bind_to_mesh`).
#
# Single-file format. One unlimited dimension `obs` plus a fixed-size
# `date_component` dimension of length 6 (year, month, day, hour, minute,
# second). Coordinates are Float64. Record ids are unique. The vertical fields
# use NaN (or a declared _FillValue, such as xarray's NaN) for "absent"; no
# other variable may hold fill values;
# a point record must give at least one vertical coordinate the inversion's
# `vertical_coordinates` use (an intake height; an altitude with a ground
# elevation, from the record or a DEM; a pressure). Root attributes pin the
# schema version and the absolute time origin.
#
# Changes from v1 (no longer read): Float64 lat/lon (v1 Float32 coordinates
# can bind a point near a cell edge to the neighbouring cell); `alt` replaced
# by elevation_m, intake_height_m, altitude_m and pressure_pa; new kind,
# time_window_s, flag and model_sigma.
#
# Optional retrieval block (issue #20, part 4): column records of a satellite
# or TCCON retrieval may carry its vertical description, and are then bound to
# an averaging-kernel column (TM5-4DVar's operator: the model column stretched
# onto the retrieval column, rebinned by pressure overlap,
# X = sum_i h_i a_i (R x)_i + sum_i h_i (1 - a_i) x_prior_i). Records on
# levels (OCO-2/OCO-3, `retrieval_mapping = "hat_levels"`; the D30 follow-up)
# are projected onto the levels' hat functions instead of rebinned
# (X = sum_j h_j a_j c_j + sum_j h_j (1 - a_j) x_prior_j). See
# [optional_dimensions] and [optional_variables] below.
#
# This file documents the schema; the loader/writer live in
# `src/Adjoints/Inversion/ObservationBinding/ObservationsIO.jl`. Any version bump
# must update both.
# ---------------------------------------------------------------------------

[meta]
version = "v2"
shipped_in = "issue #20 (part 3)"
intended_for = "src/Adjoints/Inversion/ObservationBinding/ObservationsIO.jl read_observations / write_observations"

[dimensions]
obs            = "unlimited"
date_component = 6   # year, month, day, hour, minute, second

# All variables below are REQUIRED — the loader rejects files that omit
# any of them. `dims` is in NetCDF order (i.e. as it appears in `ncdump`),
# which is the REVERSE of Julia's column-major order.

[variables.id]
dtype = "i64"
dims  = ["obs"]
description = "unique observation identifier (departures are joined to records by id; the loader rejects repeated ids)"

[variables.date_components]
dtype = "i16"
dims  = ["obs", "date_component"]
description = "(year, month, day, hour, minute, second) UTC per observation: the centre of its sampling window"

[variables.lat]
dtype = "f64"
dims  = ["obs"]
units = "degrees_north"
description = "observation latitude, in [-90, 90]"

[variables.lon]
dtype = "f64"
dims  = ["obs"]
units = "degrees_east"
description = "observation longitude, any convention with |lon| <= 720"

[variables.kind]
dtype = "string"
dims  = ["obs"]
description = "'point' (an in-situ sample placed in the column) or 'column' (a column average: an averaging-kernel column with a retrieval block, else the air-mass-weighted column mean)"

[variables.elevation_m]
dtype = "f64"
dims  = ["obs"]
units = "m"
description = "ground elevation above sea level; NaN = absent"

[variables.intake_height_m]
dtype = "f64"
dims  = ["obs"]
units = "m"
description = "sampling height above the ground; NaN = absent (column records: NaN)"

[variables.altitude_m]
dtype = "f64"
dims  = ["obs"]
units = "m"
description = "sampling altitude above sea level; NaN = absent (column records: NaN)"

[variables.pressure_pa]
dtype = "f64"
dims  = ["obs"]
units = "Pa"
description = "total (ambient) pressure at the sample, positive; NaN = absent (column records: NaN)"

[variables.time_window_s]
dtype = "f64"
dims  = ["obs"]
units = "s"
description = "length of the sampling window centred on the record time; 0 = the model step containing the time"

[variables.flag]
dtype = "i8"
dims  = ["obs"]
description = "quality flag: 0 = assimilate; bind_to_mesh drops records with any other value, or co-samples them (simulated and reported, never assimilated) with flagged_records = 'cosample'. The OCO-2 MIP converter writes 1 + assimilate_flag for records outside the experiment's set"

[variables.value]
dtype = "f64"
dims  = ["obs"]
description = "observation value in the tracer's native unit (dry mole fraction for trace gases); OPTIONAL units attribute: a dry mole-fraction unit ('mol mol-1', '1', 'ppm', 'ppb', ...) is converted to mol/mol and must then be stated on value, value_sigma and model_sigma alike; required (a mole-fraction unit) in files with retrieval blocks"

[variables.value_sigma]
dtype = "f64"
dims  = ["obs"]
description = "1-sigma observation error in the tracer's native unit, positive; units as for value"

[variables.model_sigma]
dtype = "f64"
dims  = ["obs"]
description = "1-sigma model/representation error, >= 0, added in quadrature: sigma = sqrt(value_sigma^2 + model_sigma^2) (+ sum_i (h_i a_i sigma_i)^2 for a retrieval block with retrieval_profile_sigma); units as for value"

[variables.instrument_type]
dtype = "string"
dims  = ["obs"]
description = "instrument family label, e.g. 'TCCON', 'ICOS', 'aircraft'"

[variables.tracer]
dtype = "string"
dims  = ["obs"]
description = "tracer name, e.g. 'CO2', 'CH4', 'CO'"

# ---------------------------------------------------------------------------
# Optional retrieval block. All of the variables below are present or none is
# (`retrieval_profile_sigma` is optional within the block). The writer adds the
# block when any record carries one.
#
# Layout: a record with N retrieval layers (retrieval_mapping = "layer_rebin")
# gives its N + 1 interface pressures and N layer values first along the
# retrieval dimensions, NaN after them (NaN padding to the longest record); a
# record with N levels ("hat_levels") gives its N level pressures and N level
# values; N is the number of its pressure weights. A
# record without a block (any point record, a column record bound to the
# air-mass-weighted column mean) is NaN throughout. Ordering: index 1 is the
# retrieval surface and pressures strictly decrease upward; every
# retrieval-level variable states it with ordering = "surface_to_top" (the
# loader requires the attribute). Units: pressures state a pressure unit
# (Pa, hPa, ...; converted to Pa), the prior and its uncertainty a dry
# mole-fraction unit ("mol mol-1", "1", "ppm", "ppb", ...; converted to
# mol/mol), weights and kernel are dimensionless ("1" or no units).
# Validation per record: finite values, strictly decreasing pressures with a
# top >= 0, weights >= 0 summing to 1 (within 1e-4), a prior in [0, 1] mol/mol,
# uncertainties >= 0, a surface pressure equal to the first pressure
# (relative 1e-6), at least two levels for a level record; only column records
# may carry a block. Such a record is an
# absolute column average: value in (0, 1] mol/mol (after unit conversion),
# value_sigma and model_sigma not above it, in the unit of the prior, as is the
# transported tracer; a file with blocks states a mole-fraction unit on value,
# value_sigma and model_sigma (the writer states "mol mol-1").
# ---------------------------------------------------------------------------

[optional_dimensions]
retrieval_level     = "the largest number of retrieval layers or levels of any record"
retrieval_interface = "retrieval_level + 1"

[optional_variables.retrieval_pressure_pa]
dtype = "f64"
dims  = ["obs", "retrieval_interface"]
units = "Pa"
ordering = "surface_to_top"
description = "retrieval pressures (total pressure), from the surface up: the N + 1 layer interfaces of a layer_rebin record, the N levels of a hat_levels record; index 1 is the retrieval surface pressure, the last the retrieval top (>= 0); NaN-padded"

[optional_variables.retrieval_pressure_weight]
dtype = "f64"
dims  = ["obs", "retrieval_level"]
units = "1"
ordering = "surface_to_top"
description = "pressure weights h_i of the retrieval layers (>= 0, sum to 1); NaN-padded"

[optional_variables.retrieval_averaging_kernel]
dtype = "f64"
dims  = ["obs", "retrieval_level"]
units = "1"
ordering = "surface_to_top"
description = "column averaging kernel a_i, normalized (dX/dx_i = h_i a_i); NaN-padded"

[optional_variables.retrieval_prior_profile]
dtype = "f64"
dims  = ["obs", "retrieval_level"]
units = "mol mol-1"
ordering = "surface_to_top"
description = "retrieval prior profile x_prior_i (dry mole fraction); NaN-padded"

[optional_variables.retrieval_profile_sigma]
dtype = "f64"
dims  = ["obs", "retrieval_level"]
units = "mol mol-1"
ordering = "surface_to_top"
description = "OPTIONAL 1-sigma uncertainty of the MODEL profile on the retrieval layers (representation/transport error, in [0, 1] mol/mol); adds the model-error term sum_i (h_i a_i sigma_i)^2 to sigma^2; NaN = none. Not the retrieval's a-priori uncertainty: the smoothing error is already in the averaging kernel"

[optional_variables.retrieval_surface_pressure_pa]
dtype = "f64"
dims  = ["obs"]
units = "Pa"
description = "retrieval surface pressure (total), equal to the first retrieval pressure; NaN = no block"

[optional_variables.retrieval_prior_column]
dtype = "f64"
dims  = ["obs"]
units = "mol mol-1"
description = "OPTIONAL retrieval prior column X_a (the OCO-2 xco2_apriori; a mole-fraction unit, converted to mol/mol): the simulated column is X_a + sum_i h_i a_i ((P x)_i - x_prior_i) (MIP protocol eq. 2); NaN = absent, then X_a = sum_i h_i x_prior_i. Written when any record gives one"

[optional_variables.retrieval_mapping]
dtype = "string"
dims  = ["obs"]
description = "how the retrieval values relate to retrieval_pressure_pa: 'layer_rebin' (means over the layers between the interfaces; the model column is rebinned by pressure overlap, TM5-4DVar's operator) or 'hat_levels' (values on the levels, linear in pressure between them, OCO-2/OCO-3; the model column is projected onto the levels' hat functions in dry air, the L2 projection c = M^-1 b); empty without a block. Written with every block; a file without it holds layer records only"

[attributes]
cs_observations_schema = "v2"   # mandatory; loader fails fast on any other value (v1 with an explanation)
time_origin = "REQUIRED: ISO-8601 string, e.g. '1900-01-01 00:00:00'"
