# Codecov settings (https://docs.codecov.com/docs/codecov-yaml).
#
# The report comes from the Julia 1.13 / ubuntu-latest job of
# .github/workflows/CI.yml, which processes coverage for src/ and ext/.
# That job runs the CPU test tiers only. The GPU backend extensions (CUDA,
# Metal, AMDGPU) cannot execute on a hosted CPU runner, so they are ignored
# below; GPU coverage comes from the opt-in diagnostics in test/diagnostic/.
# Real-data preprocessing paths still count as uncovered.

coverage:
  range: 50..90
  round: down
  precision: 2

  status:
    # Whole-project coverage may drop by up to 2 percentage points relative
    # to the base commit before the status turns red.
    project:
      default:
        target: auto
        threshold: 2%
    # New and changed lines: reported but never failing. Runtime branches for
    # GPU backends (src/Architectures.jl) and real-data paths cannot run on a
    # hosted CPU runner, so a red patch status would only measure that.
    # `target: auto` means the base project coverage (~83 %) minus `threshold`.
    patch:
      default:
        target: auto
        threshold: 20%
        informational: true

comment:
  layout: "diff, flags, files"
  require_changes: true

github_checks:
  annotations: false

ignore:
  - "test/**"
  - "scripts/**"
  - "docs/**"
  - "benchmarking/**"
  - "examples/**"
  - "config/**"
  - "tools/**"
  - "ext/AtmosTransportCUDAExt.jl"
  - "ext/AtmosTransportMetalExt.jl"
  - "ext/AtmosTransportAMDGPUExt.jl"
  - "**/heritage/**"
  - "**/archived/**"
  - "**/likely_legacy/**"
