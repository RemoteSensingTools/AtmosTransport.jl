[package]
name = "atmos-bin"
version = "0.1.0"
edition = "2024"
description = "Fast header queries for AtmosTransport binary stores"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
rayon = "1.11"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
walkdir = "2.5"

