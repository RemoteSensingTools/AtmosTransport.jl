name: Documentation

on:
  push:
    branches: [main]
    tags: '*'
  pull_request:

env:
  ATMOSTR_STRUCTURE_BASE: origin/${{ github.base_ref || 'main' }}

jobs:
  build:
    permissions:
      actions: write
      contents: write
      pull-requests: read
      statuses: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch structure base
        run: git fetch --no-tags --depth=1 origin "+refs/heads/${ATMOSTR_STRUCTURE_BASE#origin/}:refs/remotes/${ATMOSTR_STRUCTURE_BASE}"
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1'
      - uses: julia-actions/cache@v2
      - name: Build and deploy
        run: julia --color=yes docs/build.jl
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
