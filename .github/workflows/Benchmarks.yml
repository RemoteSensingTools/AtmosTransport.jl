name: Benchmarks

on:
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish benchmark dashboard data"
        required: true
        default: "false"
        type: choice
        options: ["false", "true"]
      run_cpu:
        description: "Run the CPU benchmark job (false for a lab-only publish)"
        required: true
        default: "true"
        type: choice
        options: ["true", "false"]
      lab_results:
        description: "Lab lane results to publish: lab/<commit>-<utc>.json on the benchmark-inbox branch (set by benchmarking/lab/run_lab_benchmarks.jl)"
        required: false
        default: ""
        type: string
      grid:
        description: "Comma-separated CS grids"
        required: true
        default: "C24,C48"
      operators:
        description: "Comma-separated operators"
        required: true
        default: "advection,diffusion,convection,full,io,adjoint"
      cpu_float_types:
        description: "Comma-separated CPU float types"
        required: true
        default: "Float32,Float64"
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/pull/') }}

# GPU numbers come from the lab lane (benchmarking/lab/run_lab_benchmarks.jl),
# which publishes through the `lab_results` input. This public repository
# deliberately has no self-hosted runners: a pull request can change the
# workflow it runs.
permissions:
  contents: read

jobs:
  cpu:
    name: CPU benchmark smoke
    if: github.event_name != 'workflow_dispatch' || github.event.inputs.run_cpu == 'true'
    runs-on: ubuntu-latest
    # Runs pull-request code: read-only token.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: julia-actions/setup-julia@v2
        with:
          version: '1'

      - uses: julia-actions/cache@v2

      - name: Instantiate benchmark environment
        shell: julia --color=yes --project=benchmarking {0}
        run: |
          using Pkg
          Pkg.instantiate()

      - name: Run benchmarks
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            GRID="C4"
            OPS="advection,diffusion,convection,full,io,adjoint"
            FLOAT_TYPES="Float32"
            STEPS="1"
            REPEATS="1"
          elif [[ "${{ github.event_name }}" == "push" ]]; then
            GRID="C4"
            OPS="advection,diffusion,convection,full,io,adjoint"
            FLOAT_TYPES="Float32,Float64"
            STEPS="1"
            REPEATS="1"
          else
            GRID="${{ github.event.inputs.grid || 'C24,C48' }}"
            OPS="${{ github.event.inputs.operators || 'advection,diffusion,convection,full,io,adjoint' }}"
            FLOAT_TYPES="${{ github.event.inputs.cpu_float_types || 'Float32,Float64' }}"
            STEPS="3"
            REPEATS="5"
          fi
          julia --color=yes --threads=2 --project=benchmarking benchmarking/run_benchmarks.jl \
            --backend=cpu \
            --float-type="${FLOAT_TYPES}" \
            --grid="${GRID}" \
            --levels=32 \
            --tracers=1,4 \
            --operator="${OPS}" \
            --steps="${STEPS}" \
            --warmup-steps=1 \
            --repeats="${REPEATS}" \
            --group="CPU Synthetic CS Sweep" \
            --output=benchmark_results.json

      - uses: actions/upload-artifact@v4
        with:
          name: cpu-benchmark-results
          path: |
            benchmark_results.json
            benchmark_results.github-action-benchmark.json

  publish:
    name: Publish benchmark dashboard
    # Never runs on pull requests. `!cancelled()` keeps a lab-only publish
    # (run_cpu=false skips the cpu job) running.
    if: ${{ !cancelled() && (github.event_name == 'push' || github.event.inputs.publish == 'true') }}
    needs: [cpu]
    runs-on: ubuntu-latest
    # contents: write pushes the dashboard data to gh-pages and lets
    # comment-on-alert leave its commit comment (it comments on commits, not
    # pull requests, so no pull-requests permission); deployments: write is
    # what github-action-benchmark documents for the gh-pages deployment.
    permissions:
      contents: write
      deployments: write
    steps:
      - uses: actions/checkout@v4

      - name: Download benchmark artifacts
        if: needs.cpu.result == 'success'
        uses: actions/download-artifact@v4
        with:
          path: benchmark-artifacts
          merge-multiple: true

      # Lab lane (benchmarking/lab/run_lab_benchmarks.jl): GPU results measured
      # on the lab machines arrive through the benchmark-inbox branch and are
      # published by the same github-action-benchmark step as CI results.
      - name: Fetch lab results
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.lab_results != ''
        shell: bash
        env:
          LAB_RESULTS: ${{ github.event.inputs.lab_results }}
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF}" != "refs/heads/main" ]]; then
            echo "::error::lab results are published from main only (dispatched on ${GITHUB_REF})"
            exit 1
          fi
          if [[ ! "${LAB_RESULTS}" =~ ^lab/[0-9a-f]{40}-[0-9]{8}T[0-9]{6}Z\.json$ ]]; then
            echo "::error::lab_results must look like lab/<40-hex commit>-<yyyymmddTHHMMSS>Z.json"
            exit 1
          fi
          git fetch --no-tags --depth=1 origin benchmark-inbox
          mkdir -p benchmark-artifacts
          git show "FETCH_HEAD:${LAB_RESULTS}" > benchmark-artifacts/lab.github-action-benchmark.json

      # The dashboard entry is attributed to github.sha, so every lab record
      # must have been measured on exactly that commit, and in one environment
      # (Julia version and Manifest sha256), as the lab lane checked.
      - name: Check lab results commit
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.lab_results != ''
        shell: python
        env:
          LAB_RESULTS: ${{ github.event.inputs.lab_results }}
        run: |
          import json, math, os, re
          sha = os.environ["GITHUB_SHA"]
          problems = []
          environments = set()
          file_commit = os.environ["LAB_RESULTS"].split("/", 1)[1].split("-", 1)[0]
          if file_commit != sha:
              problems.append(f"{os.environ['LAB_RESULTS']} names commit {file_commit}, workflow runs on {sha}")
          with open("benchmark-artifacts/lab.github-action-benchmark.json") as handle:
              records = json.load(handle)
          if not isinstance(records, list) or not records:
              raise SystemExit("::error::lab results must be a non-empty JSON array")
          names = set()
          for record in records:
              name = record.get("name") if isinstance(record, dict) else None
              if not isinstance(name, str):
                  problems.append(f"record without a name: {record!r}"[:200])
                  continue
              if name in names:
                  problems.append(f"duplicate series {name}")
              names.add(name)
              value = record.get("value")
              if record.get("unit") != "s/step" or not isinstance(value, (int, float)) or not math.isfinite(value) or value <= 0:
                  problems.append(f"{name}: expected a positive s/step value")
              try:
                  extra = json.loads(record.get("extra", ""))
                  extra = extra if isinstance(extra, dict) else {}
              except (TypeError, ValueError):
                  extra = {}
              commit = extra.get("commit")
              if commit != sha:
                  problems.append(f"{name}: measured on {commit}, workflow runs on {sha}")
              julia, manifest = str(extra.get("julia_version", "")), str(extra.get("manifest_sha256", ""))
              if not re.match(r"^[0-9]+\.[0-9]+\.[0-9]+", julia) or not re.fullmatch(r"[0-9a-f]{64}", manifest):
                  problems.append(f"{name}: no environment fingerprint (julia_version, manifest_sha256)")
              environments.add((julia, manifest))
          if len(environments) > 1:
              problems.append(f"lab records come from {len(environments)} environments: {sorted(environments)}")
          if problems:
              for problem in problems[:50]:
                  print(f"::error::{problem}")
              raise SystemExit(f"{len(problems)} lab record problem(s); nothing published")
          print(f"{len(records)} lab records for {sha} accepted")

      - name: Merge benchmark records
        shell: python
        run: |
          import glob, json
          files = sorted(glob.glob("benchmark-artifacts/*.github-action-benchmark.json"))
          if not files:
              raise SystemExit("no benchmark dashboard artifacts found")
          records = []
          for path in files:
              with open(path) as handle:
                  records.extend(json.load(handle))
          with open("benchmark_results_all.github-action-benchmark.json", "w") as handle:
              json.dump(records, handle, indent=2)
              handle.write("\n")

      - name: Publish dashboard
        uses: benchmark-action/github-action-benchmark@v1
        with:
          tool: customSmallerIsBetter
          output-file-path: benchmark_results_all.github-action-benchmark.json
          benchmark-data-dir-path: "benchmarks"
          github-token: ${{ secrets.GITHUB_TOKEN }}
          # A dispatch payload has no head commit, so the action would look up
          # the branch head at publish time; pin the entry to the commit the
          # records were measured (and the lab check verified) on. Pushes use
          # their payload's head commit and are unaffected.
          ref: ${{ github.sha }}
          auto-push: true
          alert-threshold: "120%"
          fail-on-alert: false
          comment-on-alert: true
          max-items-in-chart: 5000

      - name: Render grouped benchmark dashboard
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin gh-pages
          git worktree add gh-pages-worktree origin/gh-pages
          python benchmarking/dashboard/render_grouped_dashboard.py \
            gh-pages-worktree/benchmarks/data.js \
            gh-pages-worktree/benchmarks/index.html
          cd gh-pages-worktree
          git checkout -B gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add benchmarks/index.html
          if git diff --cached --quiet; then
            echo "Grouped dashboard is already up to date."
          else
            git commit -m "Render grouped benchmark dashboard"
            git push origin gh-pages
          fi
