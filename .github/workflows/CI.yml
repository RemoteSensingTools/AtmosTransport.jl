name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/pull/') }}

jobs:
  # Early feedback: the quick set of test/groups.toml (metadata gates, Aqua,
  # JET, physics smokes) reports in minutes. It does not replace the full suite
  # below, which is the merge check.
  quick:
    name: Quick tests (Julia 1)
    runs-on: ubuntu-latest
    permissions:
      actions: write   # julia-actions/cache deletes superseded caches
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1'
      - uses: julia-actions/cache@v2
      - uses: julia-actions/julia-buildpkg@v1
      - uses: julia-actions/julia-runtest@v1
        with:
          coverage: false
          test_args: '--quick'

  test:
    name: Julia ${{ matrix.version }} - ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    permissions:
      actions: write   # julia-actions/cache deletes superseded caches
      contents: read
      id-token: write  # Codecov upload authenticates with GitHub OIDC, no secret
    strategy:
      fail-fast: false
      matrix:
        version: ['1.10', '1.12', '1.13']
        os: [ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: ${{ matrix.version }}
      - uses: julia-actions/cache@v2
      - uses: julia-actions/julia-buildpkg@v1
      # julia-runtest records coverage by default (input `coverage: true`).
      - uses: julia-actions/julia-runtest@v1
      # One coverage report per run: the newest pinned Julia release (1.13) on Linux.
      - uses: julia-actions/julia-processcoverage@v1
        if: matrix.version == '1.13' && matrix.os == 'ubuntu-latest'
        with:
          directories: src,ext
      - uses: codecov/codecov-action@v5
        if: matrix.version == '1.13' && matrix.os == 'ubuntu-latest'
        with:
          files: lcov.info
          disable_search: true
          # Pull requests from forks get no OIDC token; Codecov accepts their
          # uploads tokenless for a public repository.
          use_oidc: ${{ !(github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork) }}
          # Codecov must not fail CI (for example before the Codecov app is
          # enabled for the repository).
          fail_ci_if_error: false
