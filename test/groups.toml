# Test groups for `test/runtests.jl` (see test/README.md).
#
# Every file of test/core/ and the regridding suite (regridding/runtests.jl)
# belongs to exactly one topic. `files` are paths relative to test/; `paths`
# are repository-relative globs (`**` crosses folders, `*` stays in one, `{a,b}`
# alternates) that map a changed file to the topic for `--changed`. A path may
# map to several topics. A changed `src/` file that no topic maps runs the
# full default tiers. `core/test_test_groups.jl` checks this file.
#
#   julia --project=test test/runtests.jl --quick
#   julia --project=test test/runtests.jl --topics=advection,diffusion
#   julia --project=test test/runtests.jl --changed[=<git-ref>]
#
# The quick set is the crucial fast check (metadata gates that CI has failed
# on, Aqua and JET, and short physics smokes); it should stay near 5 minutes
# in one process. The full suite (no flags) remains the merge requirement.

quick = [
    "core/test_aqua.jl",
    "core/test_jet.jl",
    "core/test_test_groups.jl",
    "core/test_keyword_calls.jl",
    "core/test_structure.jl",
    "core/test_physical_constants.jl",
    "core/test_readme_current.jl",
    "core/test_public_api_surface.jl",
    "core/test_public_docstrings.jl",
    "core/test_environment_variables.jl",
    "core/test_documentation_links.jl",
    "core/test_config_schema_agreement.jl",
    "core/test_config_key_checks.jl",
    "core/test_public_contracts.jl",
    # Physics smokes: mass conservation and uniform-tracer invariance of the
    # advection kernels, convection and diffusion; driven lat-lon runs and a
    # cubed-sphere run across file handoffs with every operator family; binary
    # write/read round trips and the replay-consistency gates.
    "core/test_advection_kernels.jl",
    "core/test_transport_model_convection.jl",
    "core/test_diffusion_mass_flux_conservation.jl",
    "core/test_window_prefetch.jl",
    "core/test_driven_simulation.jl",
    "core/test_cs_multifile_equivalence.jl",
    "core/test_binary_inspector.jl",
    "core/test_cs_optional_2d_sections.jl",
    "core/test_replay_consistency.jl",
]

