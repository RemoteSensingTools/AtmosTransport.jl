# ERA5 retained spectrum directly to C24, TM5 face integrals and layer balance.
[input]
spectral_dir = "/temp1/cfranken/goldens/inputs/era5_0.5x0.5/spectral_hourly"
thermo_dir   = "/temp1/cfranken/goldens/inputs/era5_0.5x0.5/physics"
surface_dir = "/temp1/cfranken/goldens/inputs/era5_0.5x0.5/surface"
coefficients = "config/era5_L137_coefficients.toml"

[output]
directory  = "@OUTPUT@"
include_qv = false
mass_basis = "dry"

[grid]
type = "cubed_sphere"
Nc = 24
regridder_cache_dir = "@OUTPUT@/_regrid_cache"
echlevs = "ml137_tropo34a"
level_top = 1
level_bot = 137
merge_min_thickness_Pa = 1000.0

[numerics]
flux_time_sampling = "window_mean"
float_type   = "Float64"
dt           = 900.0
met_interval = 3600.0

[mass_fix]
enable                = true
qv_global_climatology = 0.00247

[preprocessing]
spectral_flux_construction = "tm5_spectral"
include_tm5_pbl = false
spectral_synthesis = "cpu"
