# Reviewed identity migrations for scripts/checks/check_structure.jl.
# A PR that moves, renames or splits a module or source folder declares each
# budget transfer here; see test/structure/README.md for the semantics. Rows
# already in the base are inert: the checker warns, and a PR that edits this
# file must delete them.
#
# [[migration]]
# from = "src/Old"
# to = ["src/New/Lower", "src/New/Upper"]
# reason = "Why the split keeps the old dependency budget"

[[migration]]
from = "AtmosTransport.Preprocessing"
to = ["AtmosTransport.Preprocessing", "AtmosTransport.Preprocessing.TransportBinary", "AtmosTransport.Preprocessing.LatLon", "AtmosTransport.Preprocessing.ReducedGaussian", "AtmosTransport.Preprocessing.CubedSphere"]
reason = "PP3: binary protocols/writers and the three grid targets leave the Preprocessing module as ordered submodules"

[[migration]]
from = "src/Preprocessing/transport_binary"
to = ["src/Preprocessing/TransportBinary", "src/Preprocessing/Targets/LatLon", "src/Preprocessing/Targets/ReducedGaussian", "src/Preprocessing/Targets/CubedSphere"]
reason = "PP3: binary and target files leave transport_binary (its source-specific drivers move with PP4 below)"

[[migration]]
from = "AtmosTransport.Preprocessing"
to = ["AtmosTransport.Preprocessing.GEOS", "AtmosTransport.Preprocessing.ERA5", "AtmosTransport.Preprocessing.MERRA2"]
reason = "PP4: native source readers and day drivers become independent submodules above the pipeline stages and targets"

[[migration]]
from = "src/Preprocessing/sources"
to = ["src/Preprocessing/Sources/ERA5"]
reason = "PP4: ERA5 GRIB geometry retains the former reader-folder users and dependency budget; GEOS/MERRA2 are covered by the driver-folder split"

[[migration]]
from = "src/Preprocessing/transport_binary"
to = ["src/Preprocessing/Sources/GEOS", "src/Preprocessing/Sources/ERA5", "src/Preprocessing/Sources/MERRA2"]
reason = "PP4: the seven remaining native-source day drivers/helpers join their readers; the deferred folder disappears"
