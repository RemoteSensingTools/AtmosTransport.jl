# Reviewed identity migrations for scripts/checks/check_structure.jl.
# A PR that moves, renames or splits a module or source folder declares each
# budget transfer here; see test/structure/README.md for the semantics. Rows
# already in the base are inert: the checker warns, and a PR that edits this
# file must delete them.
#
# [[migration]]
# from = "src/Old"
# to = ["src/New/Lower", "src/New/Upper"]
# reason = "Why the split keeps the old dependency budget"

[[migration]]
from = "AtmosTransport.Preprocessing.Core"
to = ["AtmosTransport.Preprocessing.Common"]
reason = "RN1: Preprocessing.Core shadowed Julia's built-in Core (JET 0.9 rewrites relative ..Core imports); retain its dependency budget"

[[migration]]
from = "AtmosTransport.Preprocessing.LatLon"
to = ["AtmosTransport.Preprocessing.LatLonTarget"]
reason = "RN1: rename target module to match CubedSphereTarget (no collision of its own); retain its dependency budget"

[[migration]]
from = "AtmosTransport.Preprocessing.ReducedGaussian"
to = ["AtmosTransport.Preprocessing.ReducedGaussianTarget"]
reason = "RN1: rename target module to match CubedSphereTarget (no collision of its own); retain its dependency budget"

[[migration]]
from = "AtmosTransport.Preprocessing.CubedSphere"
to = ["AtmosTransport.Preprocessing.CubedSphereTarget"]
reason = "RN1: rename target module; CubedSphere is also a package dependency; retain its dependency budget"
