# Test environment for targeted single-file invocation:
#
#   julia --project=test test/core/test_aqua.jl
#   julia --project=test test/core/test_jet.jl
#   julia --project=test test/core/test_readme_current.jl
#
# `Pkg.test()` uses this file when it is present. Tests import the cached
# package inside isolated modules. Dependencies used directly by test
# fixtures must also be listed here alongside test-only packages.
#
# When adding a test-only dependency:
#   1. Add it to the root Project.toml's [extras] and [targets.test].
#   2. Add it here so `julia --project=test path/to/test.jl` works.
#   3. Keep the versions in sync.

