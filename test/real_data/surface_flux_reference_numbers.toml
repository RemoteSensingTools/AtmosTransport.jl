# Design 4.2 'sum_24h GPP*3600 = -daily*K': holds with K = Float32(1e-3*44/12). The script ran in NumPy 1.x
# float32 arithmetic (float32 array * Python float stays float32), so every hourly value carries the
# -2.66e-8 relative error of Float32(K): annual totals from the hourly file differ from the JSON by
# -2.6e-8 with the Float64 K and by 2.4e-10 (GPP) / 1.8e-11 (TER) with Float32(K). TER is reproduced
# bitwise by Float32(d32 * Float32(K)) / 86400f0 in every cell-day. The Float32 daily GPP is not stored,
