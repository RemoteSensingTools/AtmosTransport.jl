# Reference numbers for the Julia surface-flux port (design_final.md section 4.2).
# Every value was verified on 2026-10-10 from EXISTING outputs, logs or JSON audits
# (and, where marked s0, from the fresh Python S0 references captured at commit 71a08395
# under /temp1/cfranken/flux_port_parity/python_ref_71a08395/, see its MANIFEST.json).
# Generated by /temp1/cfranken/flux_port_parity/python_ref_71a08395/_tools/write_reference_toml.jl
# from the JSON written by /temp1/cfranken/flux_port_parity/python_ref_71a08395/_tools/probe_reference_numbers.py (one JSON per section in /temp1/cfranken/flux_port_parity/probes/s0_reference_numbers).
# Added afterwards (2026-10-10) and NOT regenerated by write_reference_toml.jl: the tables
# refine.sum_rho_area, nee_climatology.month_means, fluxcom_x.identity_24h, sif_iav.anomaly,
# eccodarwin.perday_vs_monthly and transcom_c180, and the audit/output keys of trendy_hourly_2021.
# They were computed in Julia by /temp1/cfranken/flux_port_parity/probes/scripts/p0_verify_reference_items.jl
# (one fragment per section in /temp1/cfranken/flux_port_parity/probes/reference_items/; each table records
# its command) and merged by p0_merge_reference_items.jl, which copies the values and checks that
# all earlier values are unchanged.
#
# File-derived annual totals use
#   PgC = sum over the year's daily records and all cells of Float64(Float32 flux) * cell_area * 86400 / K / 1e12
# (numpy float64 pairwise sums; cell_area is the Float64 variable stored in the same file).
# K is the carbon->CO2 factor the file was WRITTEN with: K_old = 44/12 for files created before
# commit 71a08395, K_new = 44.0095/12.0107 for the S0 files. Divided by its own K, a file gives
# the carbon that went into it, so these carbon totals do not depend on the K change.
# Values copied from logs keep the printed precision; values from JSON audits are exact.

[meta]
generated = "2026-10-10"
commit = "71a083956250d1b2ed49c1d75c483f9484cc74f7"
k_old = 3.6666666666666665
k_new = 3.6641910962724906
k_new_over_k_old = 0.999324844437952
probe = "/temp1/cfranken/flux_port_parity/python_ref_71a08395/_tools/probe_reference_numbers.py"
s0_manifest = "/temp1/cfranken/flux_port_parity/python_ref_71a08395/MANIFEST.json"

